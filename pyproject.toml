[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardia-ai"
version = "0.1.0"
description = "Guardiã AI — apoio ao atendimento de mulheres em situação de violência (Tech Challenge 5, FIAP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # web (server-rendered, htmx 4)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # data / ml
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "joblib>=1.4",
    "matplotlib>=3.9",
    # llm / orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.2",
    "chromadb>=0.5",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "torch>=2.2",  # declared directly so [tool.uv.sources] can pin the CPU wheel on Linux
    "openai>=1.40",
    "langsmith>=0.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # infra
    "huggingface_hub>=0.24",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "jupytext>=1.16", "nbconvert>=7.16", "ipykernel>=6.29"]
audio = ["faster-whisper>=1.1"]

[project.scripts]
guardia = "guardia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guardia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

# CPU-only PyTorch on Linux (the Docker image): the default Linux wheels pull ~10 GB of CUDA libraries that
# the app never uses (embeddings run on CPU). macOS keeps the default wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
