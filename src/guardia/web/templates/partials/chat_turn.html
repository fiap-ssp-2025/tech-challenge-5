<article class="grid gap-2">
  <p class="text-sm font-medium">Você: {{ t.question }}</p>
  {% if t.backend == 'error' %}
  <div class="alert" data-variant="destructive" role="alert"><h2>A LLM não respondeu</h2><section>{{ t.error }}</section></div>
  {% else %}
  <div class="rounded-lg bg-muted p-3 text-sm whitespace-pre-line">{{ t.answer }}</div>
  <div class="flex flex-wrap items-center gap-1.5 text-xs">
    <span class="badge" data-variant="{{ 'secondary' if t.coverage == 'total' else ('outline' if t.coverage == 'parcial' else 'destructive') }}">cobertura {{ t.coverage }}</span>
    {% for s in t.sources %}<span class="badge" data-variant="{{ 'default' if s.title in t.cited else 'outline' }}" title="{{ s.file }}">{{ s.title }}</span>{% endfor %}
    <span class="text-muted-foreground">{{ t.model }} · {{ t.latency_ms }} ms</span>
  </div>
  {% endif %}
</article>
