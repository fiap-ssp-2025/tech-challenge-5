<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='350' viewBox='0 0 1000 350'><defs><marker id='ah' markerWidth='9' markerHeight='9' refX='8' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#5E3A63'/></marker></defs><rect width='1000' height='350' fill='white'/><text x='500' y='24.0' font-size='12.5' fill='#6B5E6E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='500' dy='0'>LangGraph · 9 nós em sequência · o estado (CaseState) é lido e escrito por todos</tspan></text><rect x='11.0' y='46' width='178' height='86' rx='8' fill='#F3EDF6' stroke='#925C98' stroke-width='1.4'/><text x='100.0' y='69.1875' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='100.0' dy='0'>1. assess_risk</tspan></text><text x='100.0' y='86.625' font-size='9.5' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='100.0' dy='0'>regras determinísticas:</tspan><tspan x='100.0' dy='11.875'>arma, ameaça, cárcere,</tspan><tspan x='100.0' dy='11.875'>gestação → nível + fatores</tspan></text><rect x='211.0' y='46' width='178' height='86' rx='8' fill='#F3EDF6' stroke='#925C98' stroke-width='1.4'/><text x='300.0' y='69.1875' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='300.0' dy='0'>2. run_model</tspan></text><text x='300.0' y='86.625' font-size='9.5' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='300.0' dy='0'>HistGB calibrado:</tspan><tspan x='300.0' dy='11.875'>probabilidade, limiar 15%,</tspan><tspan x='300.0' dy='11.875'>SHAP do caso</tspan></text><rect x='411.0' y='46' width='178' height='86' rx='8' fill='#F3EDF6' stroke='#925C98' stroke-width='1.4'/><text x='500.0' y='69.1875' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='500.0' dy='0'>3. retrieve_protocols</tspan></text><text x='500.0' y='86.625' font-size='9.5' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='500.0' dy='0'>busca híbrida</tspan><tspan x='500.0' dy='11.875'>(vetor + BM25, RRF):</tspan><tspan x='500.0' dy='11.875'>até 6 trechos citáveis</tspan></text><rect x='611.0' y='46' width='178' height='86' rx='8' fill='#F3EDF6' stroke='#925C98' stroke-width='1.4'/><text x='700.0' y='69.1875' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='700.0' dy='0'>4. define_actions</tspan></text><text x='700.0' y='86.625' font-size='9.5' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='700.0' dy='0'>ações e encaminhamentos</tspan><tspan x='700.0' dy='11.875'>por nível de risco</tspan><tspan x='700.0' dy='11.875'>(190, DEAM, MPU, CREAS…)</tspan></text><rect x='811.0' y='46' width='178' height='86' rx='8' fill='#F3EDF6' stroke='#925C98' stroke-width='1.4'/><text x='900.0' y='75.125' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='900.0' dy='0'>5. build_explanation</tspan></text><text x='900.0' y='92.5625' font-size='9.5' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='900.0' dy='0'>texto com risco, modelo</tspan><tspan x='900.0' dy='11.875'>e fontes para a LLM</tspan></text><rect x='611.0' y='190' width='178' height='86' rx='8' fill='#F3EDF6' stroke='#925C98' stroke-width='1.4'/><text x='700.0' y='219.125' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='700.0' dy='0'>6. prepare_audit</tspan></text><text x='700.0' y='236.5625' font-size='9.5' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='700.0' dy='0'>hash SHA-256 do relato,</tspan><tspan x='700.0' dy='11.875'>risco e fontes</tspan></text><rect x='411.0' y='190' width='178' height='86' rx='8' fill='#E9DDEC' stroke='#925C98' stroke-width='1.4'/><text x='500.0' y='219.125' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='500.0' dy='0'>7. generate_note</tspan></text><text x='500.0' y='236.5625' font-size='9.5' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='500.0' dy='0'>LLM geradora → JSON</tspan><tspan x='500.0' dy='11.875'>por schema; blocklist</tspan></text><rect x='211.0' y='190' width='178' height='86' rx='8' fill='#E9DDEC' stroke='#925C98' stroke-width='1.4'/><text x='300.0' y='213.1875' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='300.0' dy='0'>8. judge</tspan></text><text x='300.0' y='230.625' font-size='9.5' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='300.0' dy='0'>LLM-juiz (outra família):</tspan><tspan x='300.0' dy='11.875'>6 critérios com trecho</tspan><tspan x='300.0' dy='11.875'>literal; reprova = bloqueia</tspan></text><rect x='11.0' y='190' width='178' height='86' rx='8' fill='#F3EDF6' stroke='#925C98' stroke-width='1.4'/><text x='100.0' y='213.1875' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='100.0' dy='0'>9. persist</tspan></text><text x='100.0' y='230.625' font-size='9.5' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='100.0' dy='0'>SQLite: nota, ficha,</tspan><tspan x='100.0' dy='11.875'>fontes, veredito,</tspan><tspan x='100.0' dy='11.875'>linha do tempo por nó</tspan></text><line x1='189.0' y1='89.0' x2='209.0' y2='89.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><line x1='389.0' y1='89.0' x2='409.0' y2='89.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><line x1='589.0' y1='89.0' x2='609.0' y2='89.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><line x1='789.0' y1='89.0' x2='809.0' y2='89.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><polyline points='900.0,132 900.0,161 700.0,161 700.0,188' fill='none' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><line x1='611.0' y1='233.0' x2='591.0' y2='233.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><line x1='411.0' y1='233.0' x2='391.0' y2='233.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><line x1='211.0' y1='233.0' x2='191.0' y2='233.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><line x1='100.0' y1='276' x2='100.0' y2='302' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><text x='100.0' y='316.0' font-size='11' fill='#6B5E6E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='100.0' dy='0'>END</tspan></text><text x='500' y='336.0' font-size='10.5' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='500' dy='0'>Falha da LLM nunca derruba o grafo: a nota degrada para regras + modelo e a auditoria registra o erro.</tspan></text></svg>