<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='210' viewBox='0 0 1000 210'><defs><marker id='ah' markerWidth='9' markerHeight='9' refX='8' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#5E3A63'/></marker></defs><rect width='1000' height='210' fill='white'/><rect x='0.0' y='40' width='176' height='84' rx='8' fill='#F3EDF6' stroke='#925C98' stroke-width='1.4'/><text x='88.0' y='67.75' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='88.0' dy='0'>1 · Prompt e schema</tspan></text><text x='88.0' y='85.375' font-size='9.8' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='88.0' dy='0'>papel de apoio, nunca decisão;</tspan><tspan x='88.0' dy='12.25'>saída JSON fechada por schema</tspan></text><line x1='176.0' y1='82.0' x2='204.0' y2='82.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><rect x='206.0' y='40' width='176' height='84' rx='8' fill='white' stroke='#925C98' stroke-width='1.4'/><text x='294.0' y='67.75' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='294.0' dy='0'>2 · Blocklist</tspan></text><text x='294.0' y='85.375' font-size='9.8' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='294.0' dy='0'>frases proibidas (prescrição,</tspan><tspan x='294.0' dy='12.25'>diagnóstico, decisão automática)</tspan></text><line x1='382.0' y1='82.0' x2='410.0' y2='82.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><rect x='412.0' y='40' width='176' height='84' rx='8' fill='#F3EDF6' stroke='#925C98' stroke-width='1.4'/><text x='500.0' y='67.75' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='500.0' dy='0'>3 · Juiz independente</tspan></text><text x='500.0' y='85.375' font-size='9.8' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='500.0' dy='0'>outra família de modelo; 6 critérios;</tspan><tspan x='500.0' dy='12.25'>reprovar exige trecho literal</tspan></text><line x1='588.0' y1='82.0' x2='616.0' y2='82.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><rect x='618.0' y='40' width='176' height='84' rx='8' fill='white' stroke='#925C98' stroke-width='1.4'/><text x='706.0' y='67.75' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='706.0' dy='0'>4 · Aviso fixo</tspan></text><text x='706.0' y='85.375' font-size='9.8' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='706.0' dy='0'>toda nota e resposta termina com</tspan><tspan x='706.0' dy='12.25'>"a decisão é da profissional"</tspan></text><line x1='794.0' y1='82.0' x2='822.0' y2='82.0' stroke='#5E3A63' stroke-width='1.6' marker-end='url(#ah)'/><rect x='824.0' y='40' width='176' height='84' rx='8' fill='#F3EDF6' stroke='#925C98' stroke-width='1.4'/><text x='912.0' y='67.75' font-size='12' fill='#2B1F2E' text-anchor='middle' font-weight='600' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='912.0' dy='0'>5 · Auditoria</tspan></text><text x='912.0' y='85.375' font-size='9.8' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='912.0' dy='0'>SQLite com hash do relato, nota,</tspan><tspan x='912.0' dy='12.25'>fontes, veredito, etapas; LangSmith</tspan></text><text x='500' y='153.25' font-size='10.8' fill='#6B5E6E' text-anchor='middle' font-weight='normal' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><tspan x='500' dy='0'>Dados públicos e anonimizados (SINAN) e relatos sintéticos. Nenhum nome, documento ou endereço é pedido; o texto do relato nunca é gravado.</tspan><tspan x='500' dy='13.5'>O painel de protocolos recebe só os campos estruturados da ficha, nunca o relato.</tspan></text></svg>