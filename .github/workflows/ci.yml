name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
        env:
          LLM_BASE_URL: ""
          JUDGE_BASE_URL: ""
          GUARDIA_DB_PATH: data/generated/ci_audit.db
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t guardia-ai .
      - run: |
          docker run -d --rm -p 8000:8000 -e LLM_BASE_URL= -e JUDGE_BASE_URL= --name guardia guardia-ai
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health && break; sleep 3; done
          curl -fs http://localhost:8000/ > /dev/null
          docker stop guardia
